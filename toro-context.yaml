      - Knowledge and Research understand the business and test the applicability of sourced practices.
      - Assets owns identity, coverage, faithful style, conservative derivatives and original-file lineage.
      - Governance reviews rights, privacy, fidelity and destination-specific approval separately from editing.
      - Operations fixes physical defects and requests new photographs; marketing edits do not conceal them.
