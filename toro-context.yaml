    - durable_rights_evidence
    - trademark_and_domain_clearance
    - governed_external_backup

cognitive_operating_model:
  spec: docs/product/TORO_BRAIN_COGNITIVE_OPERATING_MODEL_V1.md
  loop:
    - scope
    - understand
    - map
    - baseline
    - diagnose
    - choose
    - design
    - execute_experiment
    - verify
    - standardize
    - automate
    - autonomize
    - learn
    - repeat
  optimization_order:
    - eliminate
    - simplify
    - standardize
    - connect_digitize
    - automate
    - agentize
    - autonomize
  autonomy_levels:
    A0: observe
    A1: explain
    A2: recommend
    A3: prepare
    A4: execute_with_approval
    A5: bounded_autonomy
    A6: closed_loop_pro
  autonomy_promotion_requires_evidence: true
  autonomy_auto_demotion_on_drift_or_quality_failure: true
  high_risk_can_remain_human_gated_at_A6: true
  not_every_finding_becomes_task: true
  research_stops_when_more_evidence_will_not_materially_change_next_safe_action: true

readiness:
  gate_document: docs/product/NEW_BUSINESS_READINESS_GATE.md
  current_stage: internal_proof
  notify_owner_on_stage_change: true
