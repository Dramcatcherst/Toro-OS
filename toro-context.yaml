product:
  id: toro-brain
  name: TORO Brain
  category: AI Portfolio and Business Operating Brain
  context_version: "2026.09.22-brain-cognitive-v1"
  status: internal_proof
  external_business_onboarding: blocked
  visible_brand: TORO Brain
  legacy_operating_alias: TORO OS

north_star: "Deep inside. Simple outside."

general_plan_governance:
  owner: TORO Brain
  portfolio_root_project_key: toro_os_portfolio_master
  operating_layer_project_key: toro_executive_control
  legacy_key_meanings:
    toro_os_portfolio_master: TORO Brain portfolio root
    toro_executive_control: TORO Brain operating/execution module; TORO OS is a technical legacy alias only
    business_truth_bible: Dreamcatcher Data & Integrations module; not the global Bible
  canonical_general_plan: docs/product/TORO_BRAIN_GENERAL_PLAN.md
  canonical_name: TORO Brain General Plan
  aliases:
    - Plan General
    - plan general
    - TORO master plan
  no_parallel_master_plans: true
  all_new_initiatives_must_map_to_general_plan: true
  all_subsystems_must_be_children_of_general_plan: true
  all_execution_plans_are_subordinate: true
  every_material_request_requires_generalization_scan: true
  every_material_request_requires_scope_assignment: true
  every_material_request_requires_subsystem_assignment: true
  every_material_request_requires_current_target_next_future_classification: true
  duplicates_must_be_merge_retire_or_explicit_exception: true
  future_ideas_are_recorded_but_not_automatically_prioritized: true

build_order:
  - identity_constitution_context
  - business_truth_model
  - connector_fabric
  - intelligence_orchestration
  - workflow_execution
  - governance_security_resilience
  - continuous_learning
  - human_experience
  - commercial_presentation

current_reference_implementation:
  name: Dreamcatcher Hotel
  role: proving_ground
  product_boundary: false

current_scope:
  prove_dreamcatcher_deeply: true
  external_businesses: false
  generalized_industry_templates: false
  portal_as_architectural_foundation: false
  whatsapp_as_architectural_foundation: false

interfaces:
  eventual_primary:
    - whatsapp
    - toro_portal
  rule: "Interfaces expose TORO Brain; they do not own shadow truth."

scope_graph:
  model: relationship_graph
  principal_can_control_multiple_scopes: true
  entity_types:
    - person
    - portfolio
    - organization
    - business
    - workspace
    - property
    - project
    - product
    - client
    - partner
    - supplier
    - asset
    - agent
  isolation_modes:
    - private
    - portfolio
    - shared_project
    - client_isolated
    - public_reference
  default_personal_isolation: private
  default_external_client_isolation: client_isolated
  cross_scope_requires_policy: true

canonical_product_specs:
  general_plan: docs/product/TORO_BRAIN_GENERAL_PLAN.md
  brain_constitution: docs/product/TORO_BRAIN_CONSTITUTION.md
  brain_master_architecture: docs/product/TORO_BRAIN_MASTER_ARCHITECTURE.md
  brain_north_star: docs/product/TORO_BRAIN_NORTH_STAR_V1.md
  cognitive_operating_model: docs/product/TORO_BRAIN_COGNITIVE_OPERATING_MODEL_V1.md
  scope_graph: docs/product/TORO_SCOPE_GRAPH_V1.md
  systems_auditor: docs/product/TORO_SYSTEMS_AUDITOR_V1.md
  openclaw_runtime_audit: docs/runbooks/TORO_OPENCLAW_RUNTIME_AUDIT.md
  subsystem_registry: docs/product/TORO_SUBSYSTEMS_AND_USER_VAULT.md
  subsystem_alignment_audit: docs/product/TORO_SUBSYSTEM_ALIGNMENT_AUDIT_2026-09-22.md
  identity_user_vault: docs/product/TORO_IDENTITY_USER_VAULT_V1.md
  people_integration: docs/product/TORO_PEOPLE_DREAMTEAM_INTEGRATION.md
  communications: docs/product/TORO_COMMS_V1.md
  tools: docs/product/TORO_TOOLS_V1.md
  user_portal: docs/product/TORO_USER_PORTAL_V1.md
  visual_brain: docs/product/TORO_VISUAL_BRAIN_ARCHITECTURE_V1.md
  visual_brain_stage_a_contracts: docs/product/TORO_VISUAL_BRAIN_STAGE_A_CONTRACTS_V1.md

canonical_sources:
  product_constitution: github
  code_and_architecture: github
  toro_owned_runtime_data: supabase
  human_control_and_transition: airtable
  narrative_strategy_and_working_memory: notion
  source_files_media_and_evidence: dropbox
  deployment_runtime_evidence: vercel
  specialist_transactional_authority: domain_system

authority_examples:
  kross: live_pms_truth
  alegra: fiscal_accounting_truth
  github: code_truth
  vercel: deployment_truth

agent_rules:
  read_start_here_first: true
  identify_scope_before_work: true
  identify_authority_before_change: true
  inspect_before_modify: true
  verify_before_done: true
  preserve_evidence: true
  prefer_reversible_changes: true
  never_claim_unverified_execution: true
  follow_cognitive_operating_model: true
  understand_before_optimize: true
  whole_value_stream_before_local_optimization: true
  outcomes_over_outputs: true
  eliminate_simplify_standardize_before_automate: true
  autonomy_is_per_workflow_not_global: true
  fail_closed_on_material_truth_freshness_gap: true

product_rules:
  one_master_brain: true
  master_brain_name: TORO Brain
  toro_os_is_execution_layer: false
  toro_os_is_technical_legacy_alias_only: true
  user_complexity_should_decrease_as_capability_grows: true
  one_visible_toro_for_normal_users: true
  specialist_agents_hidden_by_default: true
  no_duplicate_source_of_truth: true
  connected_does_not_mean_integrated: true
  integrated_does_not_mean_automated: true
  automated_does_not_mean_verified: true
  deployed_does_not_mean_adopted: true
  internal_subsystems_require_toro_prefix: true
  one_canonical_identity_per_human: true
  no_silent_cross_user_memory: true
  no_silent_personal_to_employer_data_promotion: true

subsystem_architecture:
  registry_document: docs/product/TORO_SUBSYSTEMS_AND_USER_VAULT.md
  naming_pattern: "TORO <Subsystem>"
  specialist_naming_pattern: "TORO <Specialist>"
  legacy_names_are_migration_aliases: true
  dreamteam_destination: TORO People
  personal_assistant_destination: TORO Personal
  communication_destination: TORO Comms
  ricosky_if_integrated: TORO Exchange
  ai_for_dreamers_relationship: separate_product_powered_by_toro
  recognition_points_owner: TORO People
  employee_learning_owners: TORO People + TORO Knowledge
  physical_map_owners: TORO Operations + TORO Assets
  automation_owners: TORO Core + TORO Tools + TORO Agents

system_auditing:
  proactive_configuration_audits: true
  compare_expected_vs_observed: true
  record_drift_risk_owner_evidence: true
  configured_does_not_mean_verified: true
  initial_priority:
    - openclaw
    - supabase
    - github
    - vercel
    - kross
    - alegra
    - wespeak
    - dropbox
    - airtable

future_workforce:
  status: future_horizon
  current_priority: false
  owners:
    - TORO People
    - TORO Knowledge
    - TORO Agents
    - TORO Governance
  worker_types:
    - human
    - ai_agent
    - software_agent
    - robot
  authorization_after_training_is_explicit: true

user_vault:
  model: logical_user_isolation_in_canonical_supabase
  physical_database_per_user_default: false
  scopes:
    - personal
    - work_private
    - work_org
    - shared
    - system
  durable_memory_requires:
    - user_id
    - purpose
    - scope
    - provenance
    - confidence
    - sensitivity
    - visibility
    - retention
    - verification_state
  personal_content_employer_visible_by_default: false
  memory_promotion: "observed -> candidate -> confirmed_or_verified -> durable -> superseded_or_expired_or_deleted"

brand:
  canonical_name: TORO Brain
  visible_brand: TORO Brain
  identity: blue_bull_brain_chip
  metaphor:
    bull: business_or_living_organization
    brain_chip: biological_intelligence_plus_ai_computation
    core_message: small_well_connected_intelligence_coordinates_a_much_larger_system
  generated_substitutes_allowed: false
  generic_replacement_bull_allowed: false
  bullfighting_or_violent_imagery_allowed: false
  current_master_logo:
    library_path: /TORO Brain/Brand/01_Master/TORO_BRAIN_LOGO_MASTER_v1.png
    dimensions: 1536x1536
    sha256: 8828b0d89b1fb2dc9aa2127c39c3322a7b6dc018f8c1baece7a7bf69f4457a98
  current_master_isotype:
    library_path: /TORO Brain/Brand/01_Master/TORO_BRAIN_ISOTYPE_MASTER_v1.png
    dimensions: 1536x1536
    sha256: 15a1b661a12cc020b905188e1638d001cc0a21d2a2f47beb4077843b478be747
