name: TEMP Context Core Dependency Refresh

on:
  push:
    branches:
      - feat/context-core-extraction-20260923

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[context-lockfile]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/context-core-extraction-20260923

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only

      - name: Install exact graph
        run: npm ci

      - name: Require clean audit
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json
          node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log("AUDIT_COUNTS=" + JSON.stringify(counts));
          const total = counts.total ?? Object.values(counts).reduce((a,b)=>a+Number(b||0),0);
          if (total !== 0) process.exit(1);
          NODE

      - name: Context tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit dependency graph
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No package changes generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: lock context-core dependency graph [context-lockfile]"
          git push origin HEAD:feat/context-core-extraction-20260923
