name: TORO Dependency Audit

on:
  push:
    branches:
      - feat/toro-today-action-loop-20260917

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Try non-forced lockfile remediation
        shell: bash
        run: |
          npm audit fix --package-lock-only || true
          echo "LOCK_DIFF_STAT"
          git diff --stat -- package-lock.json
          echo "LOCK_DIFF_PACKAGES"
          git diff -- package-lock.json | grep -E '^[+-].*"(version|resolved)"' | head -120 || true
      - name: Audit remediated lockfile
        shell: bash
        run: |
          npm audit --json > audit-after.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit-after.json', 'utf8'));
          console.log('AUDIT_AFTER_SUMMARY=' + JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          for (const [name, v] of Object.entries(audit.vulnerabilities ?? {})) {
            console.log('AUDIT_AFTER_ITEM=' + JSON.stringify({
              name,
              severity: v.severity,
              isDirect: v.isDirect,
              range: v.range,
              fixAvailable: v.fixAvailable
            }));
          }
          NODE
      - name: Verify remediated dependency graph
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
