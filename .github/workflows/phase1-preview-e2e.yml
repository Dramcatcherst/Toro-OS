name: Phase 1 Real Preview E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/toro/**'
      - 'src/features/auth/**'
      - 'src/features/decisions/**'
      - 'src/features/executive/**'
      - 'src/features/search/**'
      - 'src/lib/supabase/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - '.github/workflows/phase1-preview-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-e2e:
    runs-on: ubuntu-latest
    env:
      TORO_E2E_BASE_URL: https://toro-pr11-preview-git-feat-toro-e9e170-dreamcatcher-s-projects.vercel.app
      TORO_E2E_FOUNDER_EMAIL: ${{ secrets.TORO_E2E_FOUNDER_EMAIL }}
      TORO_E2E_FOUNDER_PASSWORD: ${{ secrets.TORO_E2E_FOUNDER_PASSWORD }}
      TORO_E2E_RESTRICTED_EMAIL: ${{ secrets.TORO_E2E_RESTRICTED_EMAIL }}
      TORO_E2E_RESTRICTED_PASSWORD: ${{ secrets.TORO_E2E_RESTRICTED_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      TORO_E2E_DECISION_TITLE: ${{ secrets.TORO_E2E_DECISION_TITLE }}
      TORO_E2E_MUTATION_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check protected credential gate
        id: credential_gate
        shell: bash
        run: |
          missing=0
          for name in \
            TORO_E2E_FOUNDER_EMAIL \
            TORO_E2E_FOUNDER_PASSWORD \
            TORO_E2E_RESTRICTED_EMAIL \
            TORO_E2E_RESTRICTED_PASSWORD \
            VERCEL_AUTOMATION_BYPASS_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::notice::$name is not configured; real Preview E2E remains pending."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Credential gate pending
        if: steps.credential_gate.outputs.ready != 'true'
        run: |
          echo "Real Preview E2E was NOT executed because protected credentials/bypass are incomplete."
          echo "This successful workflow run must not be treated as an E2E pass."

      - name: Setup Node
        if: steps.credential_gate.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.credential_gate.outputs.ready == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.credential_gate.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run real Preview E2E
        if: steps.credential_gate.outputs.ready == 'true'
        run: npm run test:e2e -- tests/e2e/toro-phase-1.spec.ts
