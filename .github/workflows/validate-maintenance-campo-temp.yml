name: Validate maintenance CAMPO access

on:
  pull_request:
    branches:
      - feat/maintenance-verified-closure-db-20260919
  push:
    branches:
      - feat/phase2-maintenance-workspace-20260919
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
