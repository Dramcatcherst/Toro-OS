name: TORO OS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Inspect installed Next docs
        run: |
          echo "NEXT_DOCS_BEGIN"
          find node_modules/next/dist/docs -type f | sort | grep -E 'route|client|server|fetch|data|loading|error' | head -120
          echo "NEXT_DOCS_END"

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
