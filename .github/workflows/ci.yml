name: TORO Brain CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toro-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Directory write contract SQL
        run: |
          npm install --prefix "$RUNNER_TEMP/toro-directory-sql-qa" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.8
          TORO_SQL_TEST_PGLITE_MODULE="file:$RUNNER_TEMP/toro-directory-sql-qa/node_modules/@electric-sql/pglite/dist/index.js" node --test tests/directory-write-contract.test.mjs

      - name: Inspection approval SQL regression
        run: |
          docker pull postgres@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
          bash tests/sql/inspection_approval_invalidation.sh

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
