name: TORO Brain CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toro-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Cloud QA configuration guards
        run: node --test scripts/portal-cloud-qa.test.mjs scripts/portal-cloud-session.test.mjs

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  cloud-qa-admission:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/portal-hoy-readonly-20261109-r14'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require an existing protected QA environment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const base=process.env.GH_API_URL+'/repos/'+process.env.GH_REPOSITORY+'/environments/portal-qa';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          const response=await fetch(base,{headers,redirect:'error'});
          assert(response.ok,'QA environment must already exist and be readable');
          const config=await response.json();
          assert(config.protection_rules?.some(rule=>rule.type==='required_reviewers'&&rule.reviewers?.length),'Human QA review is required');
          assert(config.deployment_branch_policy?.custom_branch_policies===true,'Exact QA branch restriction required');
          const policies=await fetch(base+'/deployment-branch-policies',{headers,redirect:'error'});
          assert(policies.ok,'Cannot verify QA branch policy');
          const branches=(await policies.json()).branch_policies;
          assert(branches?.length===1&&branches[0].name==='release/portal-hoy-readonly-20261109-r14'&&branches[0].type!=='tag','Only the selective QA branch is permitted');
          NODE

  cloud-qa:
    needs: [validate, cloud-qa-admission]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/portal-hoy-readonly-20261109-r14'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: portal-qa
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Require approval bound to this exact candidate and preview
        env:
          APPROVED_SHA: ${{ vars.PORTAL_QA_APPROVED_SHA }}
          CANDIDATE_SHA: ${{ github.sha }}
          QA_URL: ${{ vars.PORTAL_QA_URL }}
          QA_ORIGIN: ${{ vars.PORTAL_QA_APPROVED_ORIGIN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert(process.env.APPROVED_SHA===process.env.CANDIDATE_SHA,'Approve exact reviewed candidate SHA');
          const url=new URL(process.env.QA_URL),origin=new URL(process.env.QA_ORIGIN);
          assert(url.protocol==='https:'&&url.origin===origin.origin&&url.pathname==='/portal'&&!url.search&&!url.hash&&!url.username&&!url.password,'Verified preview target required');
          assert(url.hostname.startsWith('toro-pr11-preview-')&&url.hostname.endsWith('-dreamcatcher-s-projects.vercel.app'),'Wrong Vercel project');
          NODE
      - name: Install reviewed locked dependencies
        run: npm ci
      - name: Install Chromium on the GitHub runner
        run: npx --no-install playwright install --with-deps chromium
      - name: Read-only Portal QA with existing authorized account
        env:
          PORTAL_QA_URL: ${{ vars.PORTAL_QA_URL }}
          PORTAL_QA_APPROVED_ORIGIN: ${{ vars.PORTAL_QA_APPROVED_ORIGIN }}
          PORTAL_QA_SHA: ${{ github.sha }}
          PORTAL_QA_IDENTIFIER: ${{ secrets.PORTAL_QA_IDENTIFIER }}
          PORTAL_QA_PASSWORD: ${{ secrets.PORTAL_QA_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/portal-cloud-qa.mjs
      # No storage-state, trace, screenshot or credential artifact is uploaded.
      # A green command is partial QA, never role/visual acceptance or release approval.
