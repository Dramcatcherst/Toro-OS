name: TORO Brain CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toro-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Chromium for Brain E2E
        run: npx playwright install --with-deps chromium

      - name: Brain keyboard E2E
        run: npx playwright test tests/brain-search.e2e.spec.ts --reporter=line
        env:
          TORO_BRAIN_CANONICAL_READ_ENABLED: "false"
