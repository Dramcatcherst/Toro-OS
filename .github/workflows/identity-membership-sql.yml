name: Identity Membership SQL

on:
  pull_request:
    paths:
      - "supabase/drafts/20260923_identity_organization_memberships*.sql"
      - "tests/sql/identity_memberships_*.sql"
      - ".github/workflows/identity-membership-sql.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: toro_identity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d toro_identity_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/toro_identity_test

    steps:
      - uses: actions/checkout@v4

      - name: Ensure psql
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Build Supabase-compatible fixture
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/identity_memberships_fixture.sql

      - name: Apply membership schema draft
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/20260923_identity_organization_memberships.sql

      - name: Apply backfill draft
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/20260923_identity_organization_memberships_backfill.sql

      - name: Assert RLS, constraints and classification
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/identity_memberships_assertions.sql

      - name: Re-run backfill for idempotency
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/20260923_identity_organization_memberships_backfill.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/identity_memberships_assertions.sql

      - name: Verify rollback
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/drafts/20260923_identity_organization_memberships_rollback.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/sql/identity_memberships_rollback_assertions.sql
