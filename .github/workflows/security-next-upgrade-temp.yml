name: TEMP Next security upgrade

on:
  push:
    branches:
      - chore/security-next-16-3-5-20260914

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/security-next-16-3-5-20260914

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Upgrade patched Next.js
        run: npm install next@16.3.5 eslint-config-next@16.3.5 --save-exact

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit summary
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json','utf8'));
          console.log('AUDIT_METADATA', JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          const vulns = audit.vulnerabilities ?? {};
          for (const [name, v] of Object.entries(vulns)) {
            console.log('AUDIT_VULN', JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:(v.via||[]).map(x=>typeof x==='string'?x:{source:x.source,name:x.name,severity:x.severity,title:x.title,range:x.range})}));
          }
          NODE

      - name: Commit generated dependency files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git commit -m "chore: upgrade Next.js security patch to 16.3.5"
          git push origin HEAD:chore/security-next-16-3-5-20260914
