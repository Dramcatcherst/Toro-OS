name: Human Layer Runtime Validation

on:
  push:
    branches:
      - feat/toro-human-layer-runtime-config-20260922
  pull_request:
    branches:
      - feat/toro-today-action-loop-20260917
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci
      - name: Human Layer contract
        run: npm test -- src/lib/server/human-layer-config.test.ts
      - name: Full tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
