name: TEMP Next 16.3.6 Security Lockfile Refresh

on:
  push:
    branches:
      - security/next-16-3-6-20260922

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[security-lockfile]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/next-16-3-6-20260922

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile on patched Next
        run: npm install next@16.3.6 eslint-config-next@16.3.6 --save-exact --package-lock-only

      - name: Install exact graph
        run: npm ci

      - name: Audit dependency graph
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/npm-audit.json
          audit_exit=$?
          set -e
          node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
          console.log("AUDIT_COUNTS=" + JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          NODE
          echo "AUDIT_EXIT=$audit_exit"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit regenerated package graph
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No package changes generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: patch Next to 16.3.6 [security-lockfile]"
          git push origin HEAD:security/next-16-3-6-20260922
