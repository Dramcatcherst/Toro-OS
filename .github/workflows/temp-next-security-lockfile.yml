name: TEMP Remaining npm Audit Detail

on:
  push:
    branches:
      - security/next-16-3-6-20260922

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/next-16-3-6-20260922

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact graph
        run: npm ci

      - name: Print exact remaining advisories
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/npm-audit.json
          set -e
          node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
          console.log("AUDIT_COUNTS=" + JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, v] of Object.entries(report.vulnerabilities ?? {})) {
            const via = (v.via ?? []).map((x) => typeof x === "string" ? x : {
              source: x.source,
              name: x.name,
              severity: x.severity,
              title: x.title,
              range: x.range,
              url: x.url
            });
            console.log("AUDIT_ITEM=" + JSON.stringify({
              name,
              severity: v.severity,
              isDirect: v.isDirect,
              range: v.range,
              nodes: v.nodes,
              via,
              effects: v.effects,
              fixAvailable: v.fixAvailable
            }));
          }
          NODE
