name: TEMP Non-Forced npm Audit Remediation

on:
  push:
    branches:
      - security/next-16-3-6-20260922

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ !contains(github.event.head_commit.message, '[audit-lockfile]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: security/next-16-3-6-20260922

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Non-forced lockfile remediation
        run: npm audit fix --package-lock-only

      - name: Install exact remediated graph
        run: npm ci

      - name: Require zero known vulnerabilities
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json
          node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log("AUDIT_COUNTS=" + JSON.stringify(counts));
          const total = counts.total ?? Object.values(counts).reduce((a,b)=>a+Number(b||0),0);
          if (total !== 0) process.exit(1);
          NODE

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit remediated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes generated."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: remediate npm audit findings [audit-lockfile]"
          git push origin HEAD:security/next-16-3-6-20260922
