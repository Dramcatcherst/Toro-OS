name: Phase 2 Maintenance TDD

on:
  push:
    branches:
      - feat/phase2-maintenance-workspace-20260919

permissions:
  contents: read

jobs:
  maintenance-tdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test -- src/features/operations/maintenance.test.tsx src/features/operations/maintenance-actions.test.ts
