name: Phase 2 Maintenance Final Validation

on:
  push:
    branches:
      - feat/phase2-maintenance-workspace-20260919

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Navigation contract
        run: npm test -- src/features/auth/role-nav.test.ts
      - name: Maintenance contract
        run: npm test -- src/features/operations/maintenance.test.tsx src/features/operations/maintenance-actions.test.ts
      - name: Full test suite
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
