name: TORO PR16 Final Validation

on:
  push:
    branches:
      - feat/toro-today-action-loop-20260917

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Verify no high or critical dependency advisories
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
          const v = audit.metadata?.vulnerabilities ?? {};
          console.log('FINAL_AUDIT=' + JSON.stringify(v));
          if ((v.critical ?? 0) > 0 || (v.high ?? 0) > 0) process.exit(1);
          NODE
      - run: npm test
      - run: npm run lint
      - run: npm run build
