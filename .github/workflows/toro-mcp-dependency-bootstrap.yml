name: TORO MCP dependency bootstrap

on:
  push:
    branches:
      - codex/toro-mcp-runtime-p1b-20260930

permissions:
  contents: write

concurrency:
  group: toro-mcp-dependency-bootstrap
  cancel-in-progress: false

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[mcp-lockfile]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@v4
        with:
          ref: codex/toro-mcp-runtime-p1b-20260930
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned MCP dependencies
        run: npm install --save-exact mcp-handler@2.1.1 @modelcontextprotocol/server@2 zod@4

      - name: Verify tests
        run: npm test

      - name: Verify lint
        run: npm run lint

      - name: Verify build
        run: npm run build

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "[mcp-lockfile] install pinned MCP dependencies"
          git push origin HEAD:codex/toro-mcp-runtime-p1b-20260930
