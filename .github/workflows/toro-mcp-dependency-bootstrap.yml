name: TORO MCP dependency bootstrap

on:
  push:
    branches:
      - codex/toro-mcp-runtime-p1b-20260930
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: toro-mcp-dependency-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  install:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'codex/toro-mcp-runtime-p1b-20260930' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout runtime branch
        uses: actions/checkout@v4
        with:
          ref: codex/toro-mcp-runtime-p1b-20260930
          fetch-depth: 0

      - name: Check whether dependencies are already generated
        id: check
        shell: bash
        run: |
          if grep -q '"mcp-handler": "2.1.1"' package.json; then
            echo "needs_install=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_install=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.check.outputs.needs_install == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install pinned MCP dependencies
        if: steps.check.outputs.needs_install == 'true'
        run: npm install --save-exact mcp-handler@2.1.1 @modelcontextprotocol/server@2 zod@4

      - name: Verify tests
        if: steps.check.outputs.needs_install == 'true'
        run: npm test

      - name: Verify lint
        if: steps.check.outputs.needs_install == 'true'
        run: npm run lint

      - name: Verify build
        if: steps.check.outputs.needs_install == 'true'
        run: npm run build

      - name: Commit generated lockfile
        if: steps.check.outputs.needs_install == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "[mcp-lockfile] install pinned MCP dependencies"
          git push origin HEAD:codex/toro-mcp-runtime-p1b-20260930
